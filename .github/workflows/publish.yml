name: Publish
on:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - run: npm install -g npm@latest
      # npm@latest changes under us; record which one published this release.
      - name: Show toolchain
        run: node --version && npm --version
      # This workflow publishes the fork's own package only: never upstream's
      # name, never from another repository, and never under `latest`.
      - name: Check release identity
        run: |
          name=$(node -p "require('./package.json').name")
          version=$(node -p "require('./package.json').version")
          test "$GITHUB_REPOSITORY" = derekslarson/opencode-claude-code-plugin
          test "$GITHUB_REF_NAME" = "v$version"
          case "$name" in @khalilgharbaoui/*) echo "refusing upstream package name $name"; exit 1 ;; esac
          case "$version" in *-mcp.*) ;; *) echo "refusing non-fork version $version"; exit 1 ;; esac
      - run: npm install
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish package
        run: npm publish --access public --tag mcp
